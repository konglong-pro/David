<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>David</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <main class="popup">
      <header class="header">
        <img class="logo" src="icons/icon-32.png" alt="">
        <div>
          <h1>David</h1>
          <p>Copy clean Markdown from this page.</p>
        </div>
      </header>

      <div class="actions" aria-label="Copy options">
        <button id="quick-copy" type="button" aria-keyshortcuts="C">
          <span class="button-title">
            <span>Quick Copy</span>
            <kbd>C</kbd>
          </span>
          <span class="button-description">
            Selected text first, otherwise the full conversation.
          </span>
        </button>

        <button id="select-messages" type="button" aria-keyshortcuts="S">
          <span class="button-title">
            <span>Select Messages</span>
            <kbd>S</kbd>
          </span>
          <span class="button-description">
            Choose one message or a continuous conversation range.
          </span>
        </button>
      </div>

      <p class="status" id="status" role="status" aria-live="polite"></p>
      <p class="keyboard-help">Press C or S. Use Tab and Enter to navigate.</p>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
